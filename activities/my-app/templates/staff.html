{% extends "base.html" %}
{% block title %}Staff dashboard · PivotPB{% endblock %}

{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
  <div>
    <p class="eyebrow mb-2"><span class="eyebrow-line" aria-hidden="true"></span>Organizer controls</p>
    <h1 class="display-title display-title-sm">Staff dashboard</h1>
    <p class="lead-muted mb-0 mt-2">Keep games moving and players informed across every court.</p>
  </div>

  <form method="get" action="{{ url_for('staff_dashboard') }}" class="filter-form">
    <label for="service_id" class="eyebrow mb-2">Court filter</label>
    <div class="d-flex gap-2">
      <select id="service_id" name="service_id" class="form-select form-select-lg">
        <option value="">All courts</option>
        {% for s in services %}
          <option value="{{ s.id }}" {% if selected == s.id %}selected{% endif %}>{{ s.name }}</option>
        {% endfor %}
      </select>
      <button type="submit" class="btn btn-ink">Show</button>
    </div>
  </form>
</div>

<div id="staff-live" data-url="{{ url_for('staff_live', service_id=selected) }}">
  {% include "_staff_live.html" %}
</div>
{% endblock %}
